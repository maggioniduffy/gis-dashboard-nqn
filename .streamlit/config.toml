[theme]
# Paleta "cuenca": papel cálido verdoso en vez del gris-azul frío anterior.
# Los nombres son los del design system (Claude Design · Neuquen Basin
# Dashboard) y se repiten como custom properties en el CSS de app.py, así
# que un cambio de color se hace en los dos lados con el mismo valor.
#
#   --paper   #eef1ea  fondo de página
#   --surface #f9faf7  sidebar, tarjetas y paneles (MÁS CLARO que el fondo:
#                      las superficies flotan por luz, no por sombra)
#   --river   #0d6e74  acento primario
#   --ink     #1a2420  texto
#   --line    #d6dbd0  bordes
primaryColor = "#0d6e74"
backgroundColor = "#eef1ea"
secondaryBackgroundColor = "#f9faf7"
textColor = "#1a2420"
linkColor = "#0d6e74"
borderColor = "#d6dbd0"
# Radios chicos (3–5px en el diseño): el dashboard tiene que leerse como un
# instrumento técnico, no como una app de consumo con esquinas redondas.
baseRadius = "small"
showWidgetBorder = true

# Tipografía a dos voces, definida a nivel de tema porque es lo único que
# alcanza a TODOS los widgets nativos (botones, inputs, tablas, sidebar) —
# el CSS inyectado por st.markdown solo llega al contenedor principal.
#   · IBM Plex Sans  → interfaz y texto corrido (antes era serif en todo,
#                      que volvía pesados los controles densos del sidebar)
#   · Source Serif 4 → solo títulos, que es de donde viene el carácter
#   · IBM Plex Mono  → lecturas numéricas (KPIs, chips, coordenadas)
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"

[theme.sidebar]
# El sidebar del diseño es una columna de papel claro separada del contenido
# por una línea fina, con los inputs un tono MÁS OSCURO que su fondo
# (invertido respecto del área principal).
backgroundColor = "#f9faf7"
secondaryBackgroundColor = "#eef1ea"
borderColor = "#d6dbd0"

[server]
headless = true
port = 8501
