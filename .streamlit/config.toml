[theme]
# Light, technical palette: cool near-white background, slate ink text, a
# sober teal accent (darkened from the old dark-theme neon #00c896 so it
# still passes contrast on white instead of just glowing). secondaryBackgroundColor
# is the sidebar / widget surface — a hair darker than the page background so
# panels read as distinct cards without a hard border everywhere.
primaryColor = "#0f766e"
backgroundColor = "#f7f9fb"
secondaryBackgroundColor = "#eef1f4"
# Tipografía serif (estilo Claude) aplicada por Streamlit a nivel de tema:
# esto llega a todos los widgets nativos (botones, inputs, tablas, sidebar,
# etc.), a diferencia del CSS inyectado por st.markdown que solo alcanza el
# contenedor principal. codeFont se deja en monospace (default) para que
# bloques de código y valores numéricos técnicos sigan siendo legibles.
font = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"

[server]
headless = true
port = 8501
